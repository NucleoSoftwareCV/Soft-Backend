# ===================================================================
# CONFIGURACIÃ“N PARA ENTORNO DE DESARROLLO LOCAL (dev)
# ===================================================================

# Base de Datos Local (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/OonaDB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Local
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Logs detallados para debugging local
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.hean.consigueventas.oonabe=DEBUG

#Ruta de guardado de imagen y limite de tamaño de imagen
app.storage.profile-images-directory=images/profile-images
app.storage.profile-images-url-prefix=/images/profile-images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=20MB

#Hikari
spring.datasource.hikari.pool-name=OonaDevPool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000