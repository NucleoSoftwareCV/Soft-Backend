# ===================================================================
# CONFIGURACIÓN PARA ENTORNO DE DESARROLLO LOCAL (dev)
# ===================================================================

# Base de Datos Local (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/OonaDB}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Local
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Logs detallados para debugging local
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.hean.consigueventas.oonabe=DEBUG
