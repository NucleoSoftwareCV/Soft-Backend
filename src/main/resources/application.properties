spring.application.name=oona-be
server.port=8083

# =====================================================
# VARIABLES DE ENTORNO
# =====================================================

spring.config.import=optional:file:.env[.properties],optional:file:oona-be/.env[.properties]

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# =====================================================
# OPENAPI / SWAGGER
# =====================================================

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.hean.consigueventas.oonabe
springdoc.paths-to-match=/api/**


# =====================================================
# SEGURIDAD JWT
# =====================================================

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION_MS}
api.security.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS}


# =====================================================
# LOGIN CON GOOGLE
# =====================================================

app.security.google.client-id=${GOOGLE_CLIENT_ID:}


# =====================================================
# PROXIES CONFIABLES
# =====================================================

app.security.trusted-proxies=${TRUSTED_PROXIES:}


# =====================================================
# CORREO SMTP
# =====================================================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:no-reply@oona.es}
app.mail.to=${MAIL_TO:}


# =====================================================
# FRONTEND
# =====================================================

app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}


# =====================================================
# OBSERVABILIDAD
# =====================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true


logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO