spring.application.name=oona-be
server.port=8083

# Importación de variables de entorno locales de forma opcional (si existe el archivo .env)
spring.config.import=optional:file:.env[.properties],optional:file:oona-be/.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# OpenAPI / Swagger
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.hean.consigueventas.oonabe
springdoc.paths-to-match=/api/**

# Seguridad JWT (expiration: 15 minutos en ms)
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=${JWT_EXPIRATION_MS}
api.security.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS}

# Login con Google: el Client ID debe coincidir con el "aud" del id_token recibido
app.security.google.client-id=${GOOGLE_CLIENT_ID:}

# IPs de proxies confiables cuyo header X-Forwarded-For se acepta para el rate limit de auth
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# SMTP para envio de emails transaccionales (recuperacion de contrasena, etc.)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@oona.es}

# URL publica del frontend, usada para construir enlaces en emails
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Observabilidad
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
